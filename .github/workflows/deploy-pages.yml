name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'deploy-pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Clean potential lockfiles and node_modules
        run: |
          set -e
          rm -rf node_modules pnpm-lock.yaml package-lock.json package-lock.ci.json || true

      - name: Install dependencies with npm (resolve native optionals)
        run: |
          set -e
          npm i
          npm rebuild --build-from-source || npm rebuild || true
        env:
          npm_config_unsafe_perm: true
          npm_config_build_from_source: true

      - name: Build
        run: npm run build

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          token: ${{ secrets.GITHUB_TOKEN }}
